<form class="card" [formGroup]="form" (ngSubmit)="submit()">
    <h2>Enter in panel administrator</h2>

    <div class="alert alert-danger" *ngIf="auth.error$ | async as error">
        {{ error }}
    </div>

    <div class="alert alert-info" *ngIf="message">
        {{message}}
    </div>

    <div class="form-control" [ngClass]="{invalid: form.get('email').touched && form.get('email').invalid}">
        <label for="email">Email:</label>
        <input id="email" type="email" formControlName="email">
        <div class="validation" *ngIf="form.get('email').touched && form.get('email').invalid">
            <small *ngIf="form.get('email').hasError('required')">Enter email field</small>
            <small *ngIf="form.get('email').hasError('email')">Enter correct email</small>
        </div>
    </div>

    <div class="form-control" [ngClass]="{invalid: form.get('password').touched && form.get('password').invalid}">
        <label for="password">Password:</label>
        <input id="password" type="password" formControlName="password">
        <div class="validation" *ngIf="form.get('password').touched && form.get('password').invalid">
            <small *ngIf="form.get('password').hasError('required')">Enter password field</small>
            <small *ngIf="form.get('password').hasError('minlength')">
                Password must be at least {{form.get('password').errors.minlength.requiredLength}} characters.
                Now {{form.get('password').errors.minlength.actualLength}}
            </small>
        </div>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-login" [disabled]="form.invalid || submitted">Sign in</button>

        <button type="button" class="btn btn-link" (click)="resetPassword()" [disabled]="submitted">Forgot
            password?</button>
    </div>
</form>
