<div class="card">
  <h2>Create new post</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">

    <div class="form-group" [ngClass]="{invalid: form.get('title').touched && form.get('title').invalid}">
      <label for="title">Post title</label>
      <input id="title" type="text" formControlName="title" placeholder="Enter post title...">
      <div *ngIf="form.get('title').touched && form.get('title').invalid" class="validation">
        <small *ngIf="form.get('title').errors.required">Title is required</small>
      </div>
    </div>

    <div class="quill-editor-container">
      <label>Post content</label>
      <quill-editor formControlName="text"></quill-editor>
      <div *ngIf="form.get('text').touched && form.get('text').invalid" class="validation">
        <small *ngIf="form.get('text').errors.required">Content is required</small>
      </div>
    </div>

    <div class="form-group" [ngClass]="{invalid: form.get('author').touched && form.get('author').invalid}">
      <label for="author">Author name</label>
      <input id="author" type="text" formControlName="author" placeholder="Enter author name...">
      <div *ngIf="form.get('author').touched && form.get('author').invalid" class="validation">
        <small *ngIf="form.get('author').errors.required">Author is required</small>
      </div>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Create post</button>
  </form>
</div>
